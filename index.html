<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Record Entry Form</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #616e7c;
      --border: #d3d9e0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success-bg: #e7f6ec;
      --success-text: #166534;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0 0 16px; }
    h2 { font-size: 1.2rem; margin: 0 0 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .field { display: flex; flex-direction: column; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
    input, select, textarea {
      font: inherit;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    textarea { resize: vertical; min-height: 70px; }
    .actions { margin-top: 20px; display: flex; gap: 10px; }
    button {
      font: inherit;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .message {
      display: none;
      background: var(--success-bg);
      color: var(--success-text);
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: var(--bg); }
    .empty { color: var(--muted); }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
    dt { font-weight: 600; color: var(--muted); }
    dd { margin: 0; word-break: break-word; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Record Entry Form</h1>

    <div class="card">
      <form id="recordForm">
        <div class="grid">
          <div class="field">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" required>
          </div>
          <div class="field">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="field">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9+\-\s()]{7,20}" required>
          </div>
          <div class="field">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required>
          </div>
          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
              <option value="">-- Select --</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
              <option>Prefer not to say</option>
            </select>
          </div>
          <div class="field">
            <label for="company">Company</label>
            <input type="text" id="company" name="company">
          </div>
          <div class="field">
            <label for="city">City</label>
            <input type="text" id="city" name="city" required>
          </div>
          <div class="field">
            <label for="country">Country</label>
            <input type="text" id="country" name="country" required>
          </div>
          <div class="field full">
            <label for="address">Address</label>
            <textarea id="address" name="address"></textarea>
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn-primary">Submit</button>
          <button type="reset" class="btn-secondary">Clear</button>
        </div>
      </form>
    </div>

    <div class="card" id="lastRecordCard" style="display:none">
      <div class="message" id="message">Record submitted successfully.</div>
      <h2>Submitted Record</h2>
      <dl id="lastRecord"></dl>
    </div>

    <div class="card">
      <h2>All Submitted Records</h2>
      <div class="table-wrap">
        <table>
          <thead id="recordsHead"></thead>
          <tbody id="recordsBody">
            <tr><td class="empty">No records submitted yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const fields = [
      { name: 'firstName', label: 'First Name' },
      { name: 'lastName',  label: 'Last Name' },
      { name: 'email',     label: 'Email' },
      { name: 'phone',     label: 'Phone' },
      { name: 'dob',       label: 'Date of Birth' },
      { name: 'gender',    label: 'Gender' },
      { name: 'company',   label: 'Company' },
      { name: 'city',      label: 'City' },
      { name: 'country',   label: 'Country' },
      { name: 'address',   label: 'Address' }
    ];
    const records = [];

    const form = document.getElementById('recordForm');
    const lastRecordCard = document.getElementById('lastRecordCard');
    const lastRecord = document.getElementById('lastRecord');
    const message = document.getElementById('message');
    const recordsHead = document.getElementById('recordsHead');
    const recordsBody = document.getElementById('recordsBody');

    function cell(tag, text) {
      const el = document.createElement(tag);
      el.textContent = text;
      return el;
    }

    function renderLastRecord(record) {
      lastRecord.innerHTML = '';
      fields.forEach(f => {
        lastRecord.appendChild(cell('dt', f.label));
        lastRecord.appendChild(cell('dd', record[f.name] || '—'));
      });
      lastRecordCard.style.display = 'block';
      message.style.display = 'block';
      setTimeout(() => { message.style.display = 'none'; }, 3000);
    }

    function renderTable() {
      recordsHead.innerHTML = '';
      const headRow = document.createElement('tr');
      headRow.appendChild(cell('th', '#'));
      fields.forEach(f => headRow.appendChild(cell('th', f.label)));
      recordsHead.appendChild(headRow);

      recordsBody.innerHTML = '';
      records.forEach((r, i) => {
        const row = document.createElement('tr');
        row.appendChild(cell('td', i + 1));
        fields.forEach(f => row.appendChild(cell('td', r[f.name] || '—')));
        recordsBody.appendChild(row);
      });
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const data = new FormData(form);
      const record = {};
      fields.forEach(f => { record[f.name] = (data.get(f.name) || '').trim(); });
      records.push(record);
      renderLastRecord(record);
      renderTable();
      form.reset();
    });
  </script>
</body>
</html>
